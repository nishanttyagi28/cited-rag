[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-rag"
version = "0.1.0"
description = "Retrieval-augmented QA over PDFs with page-level citations, hybrid search, reranking and an eval harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nishant Tyagi" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pymupdf>=1.24",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.0"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cited-rag = "cited_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads/loads real models (deselect with -m 'not slow')"]
