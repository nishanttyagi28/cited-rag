name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install (cpu torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: data/*.pdf
          key: corpus-${{ hashFiles('data/manifest.json') }}
      - name: fetch corpus
        run: python scripts/fetch_data.py
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: unit tests
        run: pytest -m "not slow" -q

  model-tests:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/cited_rag/config.py') }}
      - name: install (cpu torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: data/*.pdf
          key: corpus-${{ hashFiles('data/manifest.json') }}
      - name: fetch corpus
        run: python scripts/fetch_data.py
      - name: slow tests with real models
        run: pytest -m slow -q
